# This repo's own checks: the scripts' tests, on every push and pull request.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Script tests
        run: |
          git config --global user.name test
          git config --global user.email test@example.com
          python tests/run.py --shard ${{ matrix.shard }}/4 --jobs 2
