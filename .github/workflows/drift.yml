# Weekly: are the harness doc sentences the briefs rely on still there?
# A gone sentence opens an issue in this repo, not in an adopting one.
name: drift

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the sentences
        id: drift
        run: |
          if python3 scripts/check.py drift --report gone.md; then
            echo "gone=0" >> "$GITHUB_OUTPUT"
          else
            echo "gone=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Open an issue
        if: steps.drift.outputs.gone == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Harness docs drifted on $(date -u +%F)" --body-file gone.md
